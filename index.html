<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="min-h-screen bg-linear-to-br from-pink-200 via-purple-200 to-blue-300">


    <main class="min-h-screen flex flex-col items-center px-4 py-8 sm:py-10">

        <!-- Header -->
        <header class="mb-8 text-center sm:mb-10">

            <h1 class="text-4xl font-bold text-purple-950 sm:text-5xl md:text-6xl">
                Tic Tac Toe
            </h1>

            <p class="mt-3 text-sm tracking-[0.2em] text-purple-900 sm:text-base">
                PLAYER O • PLAYER X
            </p>

        </header>


        <!-- Game Board -->
        <section aria-label="Tic Tac Toe game board"
            class="grid w-full max-w-115 grid-cols-3 gap-3 rounded-3xl border-2 border-white/40 bg-purple-300/40 p-3 shadow-2xl sm:gap-4 sm:p-4">

            <button type="button" aria-label="خانه اول"
                class="aspect-square rounded-2xl bg-pink-50 text-5xl font-bold text-rose-600 transition-all duration-500 hover:bg-pink-100 sm:text-6xl md:text-7xl">
                O
            </button>

            <button type="button" aria-label="خانه دوم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه سوم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه چهارم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه پنجم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه ششم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه هفتم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه هشتم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

            <button type="button" aria-label="خانه نهم"
                class="aspect-square rounded-2xl bg-pink-50 transition-all duration-500 hover:bg-pink-100"></button>

        </section>


        <!-- Reset Button -->
        <button type="button"
            class="mt-8 rounded-2xl bg-purple-800 px-8 py-3 text-base font-semibold text-white shadow-lg transition-all duration-500 hover:scale-105 hover:bg-purple-900 active:scale-95 sm:mt-10">
            Reset Game
        </button>

    </main>



</body>

</html>
